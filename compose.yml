services:
  db:
    image: postgres:18
    container_name: occupancy-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: occupancy_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: occupancy_db

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data: